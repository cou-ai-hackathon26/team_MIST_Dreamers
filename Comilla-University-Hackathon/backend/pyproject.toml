[project]
name = "ek-call-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E/F: real errors, I: sorted imports, UP: modern Python syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
