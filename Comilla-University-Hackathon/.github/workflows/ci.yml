# CI: every push and every pull request into main runs the same checks as before a commit
# (CLAUDE.md "Tests"): ruff + pytest for the backend, lint + build for the app.
# Runs on GitHub's own machines, never on our server. Needs no secrets: tests use fakes, and the
# tests that need a downloaded model (e5, BanglaBERT) skip themselves.

name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU PyTorch first, as in requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install git+https://github.com/csebuetnlp/normalizer

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
